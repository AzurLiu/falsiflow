[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "falsiflow"
version = "0.2.0"
description = "Tiny CLI and GitHub Action for blocking numeric claims without reviewable evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Falsiflow contributors" }
]
keywords = [
  "ci",
  "claim-checking",
  "evidence",
  "metrics",
  "provenance",
  "quality-gates",
  "reproducibility"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/AzurLiu/falsiflow"
Documentation = "https://github.com/AzurLiu/falsiflow#readme"
Source = "https://github.com/AzurLiu/falsiflow"
Issues = "https://github.com/AzurLiu/falsiflow/issues"
Changelog = "https://github.com/AzurLiu/falsiflow/blob/main/CHANGELOG.md"

[project.scripts]
falsiflow = "falsiflow.cli:main"

[tool.setuptools]
packages = ["falsiflow"]
