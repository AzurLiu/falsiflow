name: Falsiflow
description: "Install Falsiflow and block numeric claims without reviewable evidence."
author: Falsiflow contributors

branding:
  icon: check-circle
  color: blue

inputs:
  mode:
    description: "Gate to run: check. claim-check is accepted as a legacy alias."
    required: false
    default: check
  python-version:
    description: "Python version for actions/setup-python."
    required: false
    default: "3.11"
  install-command:
    description: "Command that installs Falsiflow before running the gate."
    required: false
    default: 'python -m pip install "$GITHUB_ACTION_PATH"'
  working-directory:
    description: "Directory where the Falsiflow command should run."
    required: false
    default: "."
  config:
    description: "Project config JSON path."
    required: true
  evidence:
    description: "Evidence CSV path."
    required: true
  out-dir:
    description: "Output directory for generated Falsiflow artifacts."
    required: false
    default: data/falsiflow/check
  strict:
    description: "Exit non-zero unless the claim is ready."
    required: false
    default: "true"
  force:
    description: "Replace an existing Falsiflow output directory."
    required: false
    default: "true"

outputs:
  out-dir:
    description: "Directory containing generated Falsiflow artifacts."
    value: ${{ steps.falsiflow.outputs.out-dir }}
  summary-json:
    description: "Machine-readable check summary."
    value: ${{ steps.falsiflow.outputs.summary-json }}
  summary-md:
    description: "Human-readable Markdown report."
    value: ${{ steps.falsiflow.outputs.summary-md }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Falsiflow
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ inputs.working-directory }}"
        python -m pip install --upgrade pip
        ${{ inputs.install-command }}

    - name: Run Falsiflow gate
      id: falsiflow
      shell: bash
      env:
        FALSIFLOW_MODE: ${{ inputs.mode }}
        FALSIFLOW_CONFIG: ${{ inputs.config }}
        FALSIFLOW_EVIDENCE: ${{ inputs.evidence }}
        FALSIFLOW_OUT_DIR: ${{ inputs.out-dir }}
        FALSIFLOW_STRICT: ${{ inputs.strict }}
        FALSIFLOW_FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail
        cd "${{ inputs.working-directory }}"

        mode="$FALSIFLOW_MODE"
        if [ "$mode" = "claim-check" ]; then
          mode="check"
        fi
        if [ "$mode" != "check" ]; then
          echo "Unsupported Falsiflow mode: $FALSIFLOW_MODE. Use mode: check." >&2
          exit 2
        fi
        if [ -z "$FALSIFLOW_CONFIG" ] || [ -z "$FALSIFLOW_EVIDENCE" ]; then
          echo "Falsiflow check requires config and evidence." >&2
          exit 2
        fi

        cmd=(falsiflow check --config "$FALSIFLOW_CONFIG" --evidence "$FALSIFLOW_EVIDENCE" --out-dir "$FALSIFLOW_OUT_DIR" --json)
        if [ "$FALSIFLOW_STRICT" = "true" ]; then
          cmd+=(--strict)
        fi
        if [ "$FALSIFLOW_FORCE" = "true" ]; then
          cmd+=(--force)
        fi
        mkdir -p "$FALSIFLOW_OUT_DIR"
        "${cmd[@]}" | tee "$FALSIFLOW_OUT_DIR/check_stdout.json"

        {
          echo "out-dir=$FALSIFLOW_OUT_DIR"
          echo "summary-json=$FALSIFLOW_OUT_DIR/claim_check.json"
          echo "summary-md=$FALSIFLOW_OUT_DIR/claim_check.md"
        } >> "$GITHUB_OUTPUT"
