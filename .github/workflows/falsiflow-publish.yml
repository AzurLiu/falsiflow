name: Falsiflow Publish

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Installed wheel smoke
        run: |
          python -m pip install dist/*.whl
          falsiflow check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_ready.csv --out-dir /tmp/falsiflow_wheel_ready --strict --force
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: falsiflow-dist
          path: dist/*

  publish-pypi:
    if: github.event_name == 'release'
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/falsiflow/
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: falsiflow-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
