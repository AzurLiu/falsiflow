name: Falsiflow Cross Platform

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile
        run: |
          python -m py_compile falsiflow/core.py falsiflow/bundle.py falsiflow/claim_check.py falsiflow/cli.py scripts/falsiflow.py scripts/falsiflow_tests/regress_falsiflow_core.py
      - name: Check ready evidence
        shell: bash
        run: |
          python scripts/falsiflow.py check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_ready.csv --out-dir "$RUNNER_TEMP/falsiflow_ready" --strict --force
      - name: Check blocked evidence
        shell: bash
        run: |
          set +e
          python scripts/falsiflow.py check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_placeholder.csv --out-dir "$RUNNER_TEMP/falsiflow_blocked" --strict --force
          status="$?"
          set -e
          test "$status" = "2"
