name: Falsiflow

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile
        run: |
          python -m py_compile \
            falsiflow/core.py \
            falsiflow/bundle.py \
            falsiflow/claim_check.py \
            falsiflow/cli.py \
            scripts/falsiflow.py \
            scripts/falsiflow_tests/regress_falsiflow_core.py

      - name: Regression
        run: python scripts/falsiflow_tests/regress_falsiflow_core.py

      - name: Minimal example smoke
        run: |
          python scripts/falsiflow.py check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_placeholder.csv --out-dir /tmp/falsiflow_placeholder --strict --force || test "$?" = "2"
          python scripts/falsiflow.py check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_blocked.csv --out-dir /tmp/falsiflow_blocked --strict --force || test "$?" = "2"
          python scripts/falsiflow.py check --config examples/minimal_numeric_claim/project.json --evidence examples/minimal_numeric_claim/evidence_ready.csv --out-dir /tmp/falsiflow_ready --strict --force

      - name: Local action ready smoke
        uses: ./
        with:
          config: examples/minimal_numeric_claim/project.json
          evidence: examples/minimal_numeric_claim/evidence_ready.csv
          out-dir: /tmp/falsiflow_action_ready
          strict: "true"

      - name: Local action blocked smoke
        id: blocked-action
        continue-on-error: true
        uses: ./
        with:
          config: examples/minimal_numeric_claim/project.json
          evidence: examples/minimal_numeric_claim/evidence_placeholder.csv
          out-dir: /tmp/falsiflow_action_blocked
          strict: "true"

      - name: Assert blocked action failed
        run: test "${{ steps.blocked-action.outcome }}" = "failure"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
